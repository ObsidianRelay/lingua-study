name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked files are safe
        shell: bash
        run: |
          tracked="$(git ls-files -- data.json main.js)"
          if [[ -n "$tracked" ]]; then
            echo "$tracked"
            echo "data.json and main.js must not be committed"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check release metadata
        run: npm run check:release

      - name: Verify release files
        run: test -f main.js && test -f manifest.json && test -f styles.css
